# Cloudflare Workers config for the ManifestMe API proxy.
#
# The proxy holds the two provider keys as Worker *secrets* (never in the app)
# and forwards requests to fal.ai / Google, injecting the key server-side.
# Optionally gated by App Attest (see src/index.js).
#
# Deploy:
#   npm install -g wrangler
#   cd proxy && npm install
#   wrangler kv namespace create ATTEST_KV        # copy the id into [[kv_namespaces]] below
#   wrangler secret put FAL_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler deploy
#
# After deploy, set APIConfig.proxyBaseURL in the iOS app to the printed
# *.workers.dev URL (or your custom domain), then remove the two
# $(…)_API_KEY entries from Info.plist and rotate the old keys.

name = "manifestme-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Team ID + bundle ID validate the App Attest app-identity hash.
# APP_TEAM_ID is not a secret; fill it in with your Apple Developer Team ID
# (required once ATTEST_MODE is "monitor" or "enforce").
[vars]
APP_TEAM_ID = "CCK3M3DML9"
APP_BUNDLE_ID = "com.xvisionboardai.app"
# ATTEST_MODE: "off" | "monitor" | "enforce"
#   off     — no attestation (relies on spend caps + Cloudflare rate limiting)
#   monitor — validate every request and LOG pass/fail, but still forward
#   enforce — reject requests that fail (401)
# The validation crypto in appattest.js was written to spec but NOT runtime-tested
# (a real attestation needs a physical device). Deploy in "monitor", confirm the
# logs show attestation + assertions passing on a real device, THEN set "enforce".
ATTEST_MODE = "monitor"

# KV namespace storing per-key public keys, assertion counters, and one-time
# attestation challenges. Create it with `wrangler kv namespace create ATTEST_KV`
# and paste the returned id here.
[[kv_namespaces]]
binding = "ATTEST_KV"
id = "a0471cfc0eee41d190fd5a28d330a206"